# What Flux applies from this repo into the app's namespace. functions.yaml
# is generated from the app's functions on every deploy; list your own
# manifests here too.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- functions.yaml
# The deploy workflow replaces app with the image it built, pinned by digest.
images:
- digest: sha256:294cb1110cdeed794689f7e2bf12fc7c3d558cb10a3e8cd6cc01b2aeec95be1d
  name: app
  newName: registry.gronblom.dev/fn-demo/fn-demo

# What Flux applies from this repo into the app's namespace. functions.yaml
# is generated from the app's functions on every deploy; list your own
# manifests here too.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- functions.yaml
# The deploy workflow replaces app with the image it built, pinned by digest.
images:
- digest: sha256:a5a759f6281be855ab864996f13a5f5084148710a993d1a997664a3d6715649f
  name: app
  newName: ghcr.io/maxemiliang/fn-demo

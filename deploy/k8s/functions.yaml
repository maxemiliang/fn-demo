# Generated by mcloud from the app's functions (maxcloud-functions
# --describe). Don't edit: the deploy workflow rewrites this file on every
# deploy. Change a function's options in its code instead.
---
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/name: hello
    app.kubernetes.io/part-of: maxcloud-functions
    run.gronblom.dev/expose: public
  name: hello
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/max-scale: "3"
        autoscaling.knative.dev/min-scale: "0"
      labels:
        app.kubernetes.io/name: hello
        app.kubernetes.io/part-of: maxcloud-functions
    spec:
      containers:
      - env:
        - name: FUNCTION_TARGET
          value: hello
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              key: uri
              name: db-app
              optional: true
        envFrom:
        - secretRef:
            name: maxcloud-s3
            optional: true
        - secretRef:
            name: app-secrets
            optional: true
        image: app
        ports:
        - containerPort: 8080
      priorityClassName: tenant
      timeoutSeconds: 300
